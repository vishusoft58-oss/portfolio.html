<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jQuery Learning</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#1d1d1d,#292929,#111);
    min-height:100vh;
    color:white;
}

/* Header */

header{
    width:100%;
    text-align:center;
    padding:30px;
    background:#0769ad;
    color:white;
    font-size:35px;
    font-weight:bold;
    letter-spacing:2px;
    box-shadow:0 4px 15px rgba(0,0,0,.4);
}

header p{
    margin-top:10px;
    font-size:16px;
    color:#ddd;
}

/* Container */

.container{
    max-width:1200px;
    margin:auto;
    padding:60px 30px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:35px;
}

/* Cards */

.box{
    background:#222;
    border:2px solid #0769ad;
    border-radius:18px;

    height:170px;

    display:flex;
    justify-content:center;
    align-items:center;

    text-decoration:none;
    color:white;

    font-size:28px;
    font-weight:bold;

    transition:.4s;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
}

.box:hover{

    transform:translateY(-10px);

    background:#0769ad;

    box-shadow:0 0 20px #0769ad,
               0 0 40px rgba(7,105,173,.5);

    border-color:white;
}

/* Footer */

footer{
    text-align:center;
    padding:20px;
    background:#111;
    color:#aaa;
    margin-top:40px;
}

/* Mobile */

@media(max-width:600px){

header{
    font-size:28px;
}

.box{
    height:140px;
    font-size:24px;
}

}
</style>

</head>

<body>

<header>

jQuery Learning 🚀

<p>Practice Day Wise Examples</p>

</header>

<div class="container">

<a href="script.html" class="box">Day 1</a>

<a href="script2.html" class="box">Day 2</a>

<a href="script3.html" class="box">Day 3</a>

<a href="script4.html" class="box">Day 4</a>

<a href="script5.html" class="box">Day 5</a>

<a href="script!.html" class="box">Mini Project</a>

</div>

<footer>

Made with HTML, CSS & jQuery ❤️

</footer>

</body>
</html>
