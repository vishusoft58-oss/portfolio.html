
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Dashboard</title>

<style>

    /* ---------- COLORS ---------- */

    :root {
        --white: #ffffff;
        --bg: #f4f6fc;
        --blue: #2f5fd0;
        --navy: #172b4d;
        --wine: #8b1e2d;
        --wine-dark: #4b0f1a;
        --text: #222;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }


    /* ---------- BODY ---------- */

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: Arial, sans-serif;
        color: var(--text);
        background:
            radial-gradient(circle at 10% 0%, rgba(139, 30, 45, 0.10), transparent 40%),
            radial-gradient(circle at 90% 100%, rgba(47, 95, 208, 0.12), transparent 40%),
            var(--bg);
    }


    /* ---------- HEADER (blue to wine) ---------- */

    header {
        position: relative;
        text-align: center;
        color: var(--white);
        padding: 50px 20px 60px;
        background: linear-gradient(120deg, var(--navy), var(--blue) 45%, var(--wine));
        border-radius: 0 0 40px 40px;
        box-shadow: 0 12px 30px rgba(23, 43, 77, 0.3);
    }

    header h1 {
        margin: 0;
        font-size: 42px;
        letter-spacing: -1px;
    }

    header p {
        margin: 10px 0 0;
        opacity: 0.85;
        font-size: 16px;
    }

    .back {
        position: absolute;
        left: 40px;
        top: 28px;
        color: var(--white);
        text-decoration: none;
        font-size: 14px;
        padding: 8px 18px;
        border: 1.5px solid rgba(255, 255, 255, 0.6);
        border-radius: 50px;
        transition: background 0.3s, color 0.3s, transform 0.3s;
    }

    .back:hover {
        background: var(--white);
        color: var(--wine);
        transform: translateX(-4px);
    }


    /* ---------- CARDS (white) ---------- */

    .container {
        flex: 1;
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 50px 30px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 26px;
    }

    .box {
        position: relative;
        height: 170px;
        border-radius: 18px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 12px;
        overflow: hidden;
        text-decoration: none;
        color: var(--navy);
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        background: var(--white);
        border: 2px solid transparent;
        border-bottom: 5px solid var(--wine);
        box-shadow: 0 8px 20px rgba(23, 43, 77, 0.10);
        transition: transform 0.4s ease, box-shadow 0.4s ease, color 0.4s ease, border-color 0.4s ease;
    }

    /* every second card has a blue bottom line */

    .box:nth-child(even) {
        border-bottom-color: var(--blue);
    }

    /* wine + blue color fills the card on hover */

    .box::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, var(--wine), var(--blue));
        opacity: 0;
        transition: opacity 0.4s ease;
    }

    /* shine sweeps across */

    .box::after {
        content: "";
        position: absolute;
        top: 0;
        left: -120%;
        width: 50%;
        height: 100%;
        background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        transform: skewX(-20deg);
        transition: left 0.7s ease;
    }

    .box:hover {
        transform: translateY(-10px);
        color: var(--white);
        border-color: var(--blue);
        box-shadow:
            0 0 0 3px rgba(47, 95, 208, 0.25),
            0 20px 35px rgba(47, 95, 208, 0.35);
    }

    .box:hover::before { opacity: 1; }

    .box:hover::after { left: 150%; }

    .box:active { transform: translateY(-4px) scale(0.98); }

    .box:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 4px;
    }

    .icon {
        position: relative;
        z-index: 1;
        width: 46px;
        height: 46px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        color: var(--white);
        background: var(--wine);
        transition: transform 0.4s, background 0.4s, color 0.4s;
    }

    .box:nth-child(even) .icon { background: var(--blue); }

    .box:hover .icon {
        transform: scale(1.15) rotate(-6deg);
        background: var(--white);
        color: var(--wine);
    }

    .label {
        position: relative;
        z-index: 1;
    }


    /* ---------- FOOTER ---------- */

    footer {
        text-align: center;
        padding: 18px;
        font-size: 14px;
        color: var(--white);
        background-color: var(--wine-dark);
        border-top: 4px solid var(--blue);
    }


    /* ---------- MOBILE ---------- */

    @media (max-width: 600px) {

        header { padding: 30px 20px 45px; }

        header h1 { font-size: 30px; }

        .back {
            position: static;
            display: inline-block;
            margin-bottom: 20px;
        }

        .container {
            padding: 30px 20px;
            grid-template-columns: 1fr;
        }

        .box { height: 130px; }
    }

    @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
    }

</style>

</head>
<body>

<header>
    <a href="index.html" class="back">← Portfolio</a>
    <h1>HTML Practice Work</h1>
    <p>Click any card to open the practice page</p>
</header>

    <a href="banner.html" class="box"><span class="icon">▤</span><span class="label">banner</span></a>
    <a href="youtube.html" class="box"><span class="icon">▶</span><span class="label">video</span></a>
    <a href="loaction.html" class="box"><span class="icon">⌖</span><span class="label">loaction</span></a>
    <a href="audio.html" class="box"><span class="icon">♪</span><span class="label">Audio</span></a>

<footer>© 2026 Practice</footer>

</html>
